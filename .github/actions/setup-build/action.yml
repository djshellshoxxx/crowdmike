name: Set up CrowdMike build
description: Installs OS build dependencies and ccache, restores the FetchContent and ccache caches, and exports the settings the configure step needs.

inputs:
  cache-key:
    description: Cache family suffix, for example "ci" or "release-macos-arm64".
    required: true
  linux-gui-deps:
    description: Install the X11/ALSA development packages (needed to compile the GUI code on Linux).
    default: "true"

outputs:
  deps-dir:
    description: Value for -DFETCHCONTENT_BASE_DIR.
    value: ${{ steps.paths.outputs.deps }}

runs:
  using: composite
  steps:
    - name: Resolve cache paths
      id: paths
      shell: bash
      run: |
        echo "deps=${GITHUB_WORKSPACE}/.deps" >> "$GITHUB_OUTPUT"
        echo "ccache=${GITHUB_WORKSPACE}/.ccache" >> "$GITHUB_OUTPUT"
        {
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache"
          echo "CCACHE_MAXSIZE=600M"
          echo "CCACHE_COMPRESS=1"
        } >> "$GITHUB_ENV"

    - name: Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        pkgs="ninja-build ccache xvfb"
        if [[ "${{ inputs.linux-gui-deps }}" == "true" ]]; then
          pkgs="$pkgs libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libxi-dev"
        fi
        sudo apt-get install -y --no-install-recommends $pkgs

    - name: macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ccache ninja

    - name: Windows dependencies
      if: runner.os == 'Windows'
      shell: bash
      run: |
        choco install ccache ninja -y --no-progress
        echo "C:/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"

    - name: MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Restore FetchContent cache (JUCE, CLAP extensions)
      uses: actions/cache@v4
      with:
        path: ${{ steps.paths.outputs.deps }}
        key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ${{ steps.paths.outputs.ccache }}
        key: ccache-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ inputs.cache-key }}-
          ccache-${{ runner.os }}-
