name: build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the Windows build as a GitHub pre-release"
        type: boolean
        default: true

concurrency:
  group: crowdmike-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libxi-dev xvfb
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - name: Configure
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build tests
        run: cmake --build build --target crowdmike_dsp_tests crowdmike_recording_tests crowdmike_tests --config Release --parallel 4
      - name: Test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi
      - name: Build plugins
        run: cmake --build build --target CrowdMike_All CrowdMike_CLAP --config Release --parallel 4
      - name: Stage Windows artefacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          $art = "build/CrowdMike_artefacts/Release"
          Copy-Item "$art/Standalone/CrowdMike.exe" stage/
          Copy-Item "$art/VST3/CrowdMike.vst3" stage/ -Recurse
          $clap = Get-ChildItem -Path build -Recurse -Filter CrowdMike.clap | Select-Object -First 1
          if ($clap) { Copy-Item $clap.FullName stage/ }
          Copy-Item README.md stage/
          Get-ChildItem stage -Recurse | Select-Object FullName, Length
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=0.2.0" "/DStageDir=$PWD\stage" "installer\CrowdMike.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path stage/* -DestinationPath CrowdMike-0.2.0-Windows-x64-portable.zip -Force
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CrowdMike-Windows-x64
          path: |
            installer/CrowdMike-*-Setup.exe
            CrowdMike-*-portable.zip
          if-no-files-found: error
      - name: Publish pre-release
        if: runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' && inputs.publish || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="windows-build-${GITHUB_SHA::7}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "CrowdMike Windows build ${GITHUB_SHA::7}" \
            --notes "Automated Windows x64 build of ${GITHUB_SHA}. Installer (Standalone + VST3 + CLAP) and portable zip. Unsigned; Windows SmartScreen may warn." \
            installer/CrowdMike-*-Setup.exe CrowdMike-*-portable.zip
