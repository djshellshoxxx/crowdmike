name: wiki-sync

# Publishes the wiki/ folder to the GitHub wiki. The wiki repo must exist once:
# create any page in the Wiki tab (UI) to initialise it, then this runs on every change.
on:
  push:
    branches: [main]
    paths: ['wiki/**', '.github/workflows/wiki-sync.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Push wiki/ to the wiki repo
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" ../wiki-repo
          rsync -a --delete --exclude .git wiki/ ../wiki-repo/
          cd ../wiki-repo
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "wiki already up to date"; exit 0; }
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
